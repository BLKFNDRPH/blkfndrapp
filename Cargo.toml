[workspace]
resolver = "2"
members = [
  "contracts/blkfndr-vault",
  "contracts/blkfndr-factory",
  "contracts/blkfndr-attestation",
  "contracts/blkfndr-approval",
  "contracts/blkfndr-identity",
  # Legacy monolithic crowdfunding contract. Superseded by the bonded vault and
  # scheduled for removal once the UI is migrated off it; listed here so that a
  # clean checkout can still build and test every contract in the tree.
  "contracts/blkfndr-soroban",
]

[workspace.dependencies]
soroban-sdk = "22.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# For more information about this profile see https://soroban.stellar.org/docs/basic-tutorials/logging#cargotoml-profile
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
