name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Authorization check
        # Calls every route handler and server action as each identity that must
        # not reach it (signed out, signed in, the wrong admin role, no cron
        # token) and fails if any gets through or causes a side effect, or if an
        # endpoint is missing from scripts/authz-manifest.mjs.
        run: npm run test:authz

      - name: Route behaviour check
        # The abuse cases the authorization check cannot see, sent to the real
        # handlers with a stubbed Supabase holding in-memory rows: the proxy's
        # nonce CSP and next.config.js's headers on a page response, a KYC
        # reviewer deciding their own check, wallet-link signatures over anything
        # but the stored challenge, malformed bodies (401 signed out, 400 signed
        # in, never 500), and /api/health and the platform health counts.
        run: npm run test:routes

      - name: Production build
        # Stand-in configuration: nothing is fetched at build time, and the
        # Supabase URL refuses connections, so the pages render signed out.
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:9
          NEXT_PUBLIC_SUPABASE_ANON_KEY: stub
          NEXT_PUBLIC_APP_URL: http://localhost:9002
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

      - name: Header delivery check
        # Starts the standalone build and reads what a browser gets: the full
        # nonce CSP on every page with the nonce on every script, and the
        # next.config.js headers on pages, API routes and static files.
        run: npm run test:headers

      - name: Database policy check
        # Replays every migration, in version order, into an in-memory Postgres
        # (PGlite) and tries the browser-session abuse cases the migrations were
        # written to refuse: self-linking a wallet, anon writes, banning an owner,
        # an unconfirmed admin invite, setting feature-request status, reading
        # KYC checks. Fails too if the migrations no longer replay cleanly.
        run: npm run test:db

      - name: Audit production dependencies
        # Prints the full report, then fails on any high or critical advisory
        # that scripts/audit-gate.mjs does not list as accepted (each accepted
        # one says why it cannot be reached here).
        run: |
          npm audit --omit=dev || true
          npm run audit:gate

      - name: Software bill of materials
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error

  contracts:
    name: Soroban contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          # Kept in step with rust-toolchain.toml.
          toolchain: "1.81.0"
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Build wasm artifacts
        # Must run before the tests: the factory's deployment tests need
        # blkfndr_vault.wasm and skip themselves when it is absent.
        run: bash scripts/build-contracts.sh

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Record build hashes
        # A reviewer checks the deployed contract against these.
        run: |
          {
            echo "## Contract build hashes"
            echo
            echo '| Contract | Bytes | sha256 |'
            echo '|---|---:|---|'
            for wasm in target/wasm32-unknown-unknown/release/*.wasm; do
              name=$(basename "$wasm" .wasm)
              size=$(wc -c < "$wasm" | tr -d ' ')
              hash=$(sha256sum "$wasm" | cut -d' ' -f1)
              echo "| \`$name\` | $size | \`$hash\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload wasm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soroban-contracts
          path: target/wasm32-unknown-unknown/release/*.wasm
          if-no-files-found: error
