[package]
name    = "blkfndr-soroban"
version = "0.1.0"
edition = "2021"
description = "BLKFNDR Crowdfunding Platform — Stellar Soroban Smart Contract"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "22.0.0" }

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]

[profile.release]
opt-level       = "z"
overflow-checks = true
debug           = 0
strip           = "symbols"
debug-assertions = false
panic           = "abort"
codegen-units   = 1
lto             = true

# Same as release but with debug-assertions enabled; useful for testnet deploys
[profile.release-with-logs]
inherits         = "release"
debug-assertions = true