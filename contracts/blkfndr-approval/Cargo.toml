[package]
name    = "blkfndr-approval"
version = "0.1.0"
edition = "2021"
description = "BLKFNDR Crowdfunding Platform — Multisig Approval Module for milestone and slash gating"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "22.0.0" }

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
