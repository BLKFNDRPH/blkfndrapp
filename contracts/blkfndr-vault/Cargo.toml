[package]
name    = "blkfndr-vault"
version = "0.1.0"
edition = "2021"
description = "BLKFNDR Crowdfunding Platform — Stellar Soroban Vault Smart Contract"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "22.0.0" }

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
