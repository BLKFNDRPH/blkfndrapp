[package]
name    = "blkfndr-vault"
version = "0.1.0"
edition = "2021"
description = "BLKFNDR Crowdfunding Platform — Stellar Soroban Vault Smart Contract"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Tests drive the real registry rather than a stub, so the attestation
# integration is exercised end to end.
blkfndr-attestation = { path = "../blkfndr-attestation" }

[features]
testutils = ["soroban-sdk/testutils"]
