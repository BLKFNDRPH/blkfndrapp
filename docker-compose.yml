# blkfndr — Portainer stack definition.
#
# Set every value in Portainer under Stack → Environment variables. Portainer
# substitutes them into the ${...} placeholders below.
#
# Two kinds of variable, and the difference matters:
#
#   build.args   Inlined into the client JavaScript by `next build`, so they are
#                PUBLIC — visible in DevTools to any visitor — and changing one
#                requires a REBUILD, not a restart. Never put a secret here.
#
#   environment  Read by server code at request time. Never enters the image.
#                Secrets belong here. Changing one takes effect on RESTART.
#
# Putting a secret in build.args publishes it to every browser. Putting a
# NEXT_PUBLIC_ value only in environment leaves it empty in the bundle, which
# fails at runtime rather than at build.
#
# Every ${VAR} below carries an explicit `:-` empty default. Without it, Compose
# warns "variable is not set, defaulting to a blank string" for each unset
# optional, and Portainer collects those warnings and renders them as a
# "Failure / [object Object]" toast — even though the stack deploys fine. The
# defaults keep the deploy warning-free. Required values are still enforced: the
# Dockerfile fails the build if Supabase or the factory id is empty, and the
# server errors clearly at runtime for a missing secret. Do not remove the `:-`.

services:
  blkfndr-app:
    # Deliberately no `image:`. It used to pin blkfndr3:latest, which is
    # host-global — Docker does not prefix an explicit tag with the stack name
    # the way it prefixes containers, volumes and networks.
    #
    # Two stacks on one host therefore shared a single image. Since every
    # NEXT_PUBLIC_* value is baked in at build time, whichever stack built last
    # silently overwrote the other's Supabase URL and contract addresses, and the
    # first stack carried on serving them with no error anywhere. A testnet and a
    # mainnet stack side by side is exactly the case that breaks.
    #
    # It also broke Portainer's "re-pull image and redeploy": an unqualified tag
    # resolves to docker.io/library/blkfndr3, which does not exist, so the pull
    # fails the deploy.
    #
    # Without it, Compose names the image after the project — tzarumang-blkfndr-app
    # — which is per-stack and cannot collide.
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # ── Supabase (required) ──────────────────────────────────────────────
        # The app cannot reach its database without these. The anon key is
        # public by design — its safety rests on Row Level Security, not on
        # secrecy. The build fails outright if either is empty.
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}

        # ── Contracts (factory required, rest strongly recommended) ──────────
        - NEXT_PUBLIC_BLKFNDR_FACTORY_CONTRACT_ID=${NEXT_PUBLIC_BLKFNDR_FACTORY_CONTRACT_ID:-}
        - NEXT_PUBLIC_BLKFNDR_IDENTITY_CONTRACT_ID=${NEXT_PUBLIC_BLKFNDR_IDENTITY_CONTRACT_ID:-}
        - NEXT_PUBLIC_BLKFNDR_ADMIN_CONTRACT_ID=${NEXT_PUBLIC_BLKFNDR_ADMIN_CONTRACT_ID:-}
        - NEXT_PUBLIC_BLKFNDR_ATTESTATION_CONTRACT_ID=${NEXT_PUBLIC_BLKFNDR_ATTESTATION_CONTRACT_ID:-}
        # The Operations Vault — the governed gas budget. Build arg, so the panel
        # can find it: setting it only in the stack environment leaves it empty in
        # the bundle, which is exactly the "Not configured" you saw. Rebuild after
        # setting it — a redeploy alone does not re-inline a NEXT_PUBLIC_ value.
        - NEXT_PUBLIC_BLKFNDR_OPERATIONS_CONTRACT_ID=${NEXT_PUBLIC_BLKFNDR_OPERATIONS_CONTRACT_ID:-}

        # ── Token contracts ──────────────────────────────────────────────────
        # Derived, not looked up, and different per network:
        #   stellar contract id asset --asset native --network <net>
        #   stellar contract id asset --asset USDC:<ISSUER> --network <net>
        # A currency left blank is simply not offered when creating a project.
        - NEXT_PUBLIC_STELLAR_XLM_TOKEN_ID=${NEXT_PUBLIC_STELLAR_XLM_TOKEN_ID:-}
        - NEXT_PUBLIC_STELLAR_USDC_TOKEN_ID=${NEXT_PUBLIC_STELLAR_USDC_TOKEN_ID:-}

        # ── Network endpoints ────────────────────────────────────────────────
        # BOTH DEFAULT TO TESTNET if left empty. A mainnet stack that omits
        # them builds cleanly and then quietly talks to testnet, which looks
        # like "no projects appear" rather than like a misconfiguration.
        - NEXT_PUBLIC_SOROBAN_RPC_URL=${NEXT_PUBLIC_SOROBAN_RPC_URL:-}
        - NEXT_PUBLIC_HORIZON_URL=${NEXT_PUBLIC_HORIZON_URL:-}

        # ── App ──────────────────────────────────────────────────────────────
        # Origin used to build OAuth redirect URIs. Must match the Site URL and
        # redirect allow-list configured in the Supabase dashboard, or Google
        # sign-in returns the user to the wrong host.
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-}
        - NEXT_PUBLIC_STELLAR_ADMIN_ADDRESS=${NEXT_PUBLIC_STELLAR_ADMIN_ADDRESS:-}
        - NEXT_PUBLIC_STELLAR_FALLBACK_ADDRESS=${NEXT_PUBLIC_STELLAR_FALLBACK_ADDRESS:-}

        # Optional. Unset renders project locations as a Google Maps link
        # instead of an embedded map — a supported mode, not a broken one.
        - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}

    restart: unless-stopped
    ports:
      # Host port is configurable because 8788 was hardcoded and a host that
      # already has it allocated fails the whole stack at container networking:
      #   Bind for 0.0.0.0:8788 failed: port is already allocated
      #
      # Set APP_PORT in the Portainer stack environment to any free port. Leaving
      # it unset publishes on 8788 as before, so existing deployments are
      # unaffected.
      #
      # To let Docker choose a free port instead, replace this whole block with
      # the container port alone:
      #
      #   ports:
      #     - "3000"
      #
      # That never collides, but the host port changes on every recreate, which
      # a reverse proxy config cannot follow. Prefer naming a free port.
      - "${APP_PORT:-8788}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_TELEMETRY_DISABLED=1

      # ── Supabase service role (required, SECRET) ─────────────────────────
      # Bypasses RLS entirely. Used by the indexer, KYC review and admin-claim
      # writes. Without it the indexer cannot write and no project ever appears.
      # Never give this a NEXT_PUBLIC_ prefix — that would ship it to browsers.
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY:-}

      # ── Additional app origins (optional) ────────────────────────────────
      # Comma-separated origins this deployment also answers on, beyond
      # NEXT_PUBLIC_APP_URL. A visitor arriving on one of these is sent back to
      # the same domain after signing in, instead of being bounced to the
      # canonical one and losing the session cookie that was just set.
      #
      # Runtime, not a build arg: nothing reads this in the browser, so adding a
      # domain takes a restart rather than a rebuild. Every origin listed here
      # must also be in the Supabase redirect allow-list.
      #
      #   APP_URLS=https://app.blkfndr.com,https://staging.blkfndr.com
      #
      # Include the port if you serve on a non-standard one — hosts are compared
      # including port, so https://example.com does not match example.com:8443.
      - APP_URLS=${APP_URLS:-}

      # ── Pinata / IPFS (required to create projects, SECRET) ──────────────
      - PINATA_JWT=${PINATA_JWT:-}
      - PINATA_GATEWAY_URL=${PINATA_GATEWAY_URL:-}
      - PINATA_GROUP_BLKDFNDR=${PINATA_GROUP_BLKDFNDR:-}

      # ── Indexer auth (required, SECRET) ──────────────────────────────────
      # Bearer token for POST /api/indexer and POST /api/ops-funding. The
      # endpoints are public without it. Shared with the cron services below.
      - INDEXER_SECRET=${INDEXER_SECRET:-}

      # ── Operations funding submitter (optional, SECRET) ──────────────────
      # A funded classic account that pays the fee for the monthly
      # fund_operations call. It holds no authority — the transfer is authorised
      # by the owners' SetOpsFunding vote — so it only needs a little XLM for gas.
      # Unset means POST /api/ops-funding cleanly skips instead of moving money.
      - OPS_FUNDING_SUBMITTER_SECRET=${OPS_FUNDING_SUBMITTER_SECRET:-}

      # ── Genkit / Gemini (optional) ───────────────────────────────────────
      # The @genkit-ai/googleai plugin reads GEMINI_API_KEY, GOOGLE_API_KEY or
      # GOOGLE_GENAI_API_KEY. This stack previously set
      # GOOGLE_GENERATIVEAI_API_KEY, which matches none of them, so the AI
      # listing review silently did nothing however valid the key was.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - next-cache:/app/.next/cache
    networks:
      - blkfndr-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)}).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "io.portainer.accesscontrol.teams=admins"
      - "app.name=blkfndr3"
      - "app.version=1.0.0"
      - "app.description=Bonded crowdfunding for real-world builds, on Stellar"

  # The ledger is the source of truth, but the site reads Postgres. This is what
  # moves data between the two: without something calling POST /api/indexer on a
  # schedule, a newly created project never appears and a funded one never
  # updates. Nothing in the app self-triggers, so it is a service rather than an
  # operational note somebody has to remember.
  #
  # It calls over the internal network, so the endpoint never needs to be
  # reachable from outside the stack for this to work.
  indexer-cron:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    # Waits for the app to pass its healthcheck before starting, so the logs do
    # not open with a burst of failed requests while Next.js is still booting.
    depends_on:
      blkfndr-app:
        condition: service_healthy
    environment:
      - INDEXER_SECRET=${INDEXER_SECRET:-}
      # Seconds between runs. The indexer is idempotent — it records a cursor
      # and skips events it has already handled — so a short interval is cheap
      # and only costs RPC calls.
      - INDEX_INTERVAL_SECONDS=${INDEX_INTERVAL_SECONDS:-60}
    entrypoint: ["/bin/sh", "-c"]
    # A block scalar, because the command contains colons (http://host:3000,
    # "Authorization:") and both quote characters — written as a plain YAML
    # scalar it is a parse error.
    command:
      - |
        echo "indexer-cron: polling every $${INDEX_INTERVAL_SECONDS}s"
        while true; do
          # --fail so an HTTP error is visible in the logs rather than being
          # swallowed as a successful request that returned an error body.
          curl --silent --show-error --fail --max-time 120 \
            -X POST http://blkfndr-app:3000/api/indexer \
            -H "Authorization: Bearer $${INDEXER_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            || echo "indexer-cron: run failed at $$(date -u +%FT%TZ)"
          sleep "$${INDEX_INTERVAL_SECONDS}"
        done
    networks:
      - blkfndr-network
    labels:
      - "app.name=blkfndr3-indexer"
      - "app.description=Periodically advances the chain event indexer"

  # Presses the monthly operations-funding button. fund_operations on the
  # treasury is permissionless and gated to once every thirty days on-chain, so
  # this can poll freely — it moves money at most once a month and skips the
  # rest. Daily is plenty; the interval only decides how soon after the gate
  # opens the top-up lands. Does nothing until owners vote SetOpsFunding and
  # OPS_FUNDING_SUBMITTER_SECRET is set — until then the endpoint returns a skip.
  ops-funding-cron:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    depends_on:
      blkfndr-app:
        condition: service_healthy
    environment:
      - INDEXER_SECRET=${INDEXER_SECRET:-}
      - OPS_FUNDING_INTERVAL_SECONDS=${OPS_FUNDING_INTERVAL_SECONDS:-86400}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "ops-funding-cron: polling every $${OPS_FUNDING_INTERVAL_SECONDS}s"
        while true; do
          curl --silent --show-error --fail --max-time 120 \
            -X POST http://blkfndr-app:3000/api/ops-funding \
            -H "Authorization: Bearer $${INDEXER_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            || echo "ops-funding-cron: run failed at $$(date -u +%FT%TZ)"
          sleep "$${OPS_FUNDING_INTERVAL_SECONDS}"
        done
    networks:
      - blkfndr-network
    labels:
      - "app.name=blkfndr3-ops-funding"
      - "app.description=Triggers the monthly operations-funding transfer"

  # Presses the abandoned-vault reclaim button. settle_stalled on each vault is
  # permissionless and self-gated (it reverts unless the vault has been abandoned
  # past its ~90-day stall window), so this can poll freely — it reclaims only the
  # vaults genuinely due and skips the rest. Daily is plenty. Shares the
  # OPS_FUNDING_SUBMITTER_SECRET gas payer; until that is set the endpoint skips.
  settle-stalled-cron:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    depends_on:
      blkfndr-app:
        condition: service_healthy
    environment:
      - INDEXER_SECRET=${INDEXER_SECRET:-}
      - SETTLE_STALLED_INTERVAL_SECONDS=${SETTLE_STALLED_INTERVAL_SECONDS:-86400}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "settle-stalled-cron: polling every $${SETTLE_STALLED_INTERVAL_SECONDS}s"
        while true; do
          curl --silent --show-error --fail --max-time 120 \
            -X POST http://blkfndr-app:3000/api/settle-stalled \
            -H "Authorization: Bearer $${INDEXER_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            || echo "settle-stalled-cron: run failed at $$(date -u +%FT%TZ)"
          sleep "$${SETTLE_STALLED_INTERVAL_SECONDS}"
        done
    networks:
      - blkfndr-network
    labels:
      - "app.name=blkfndr3-settle-stalled"
      - "app.description=Reclaims abandoned funded vaults for contributors"

volumes:
  next-cache:
    driver: local

networks:
  blkfndr-network:
    driver: bridge
